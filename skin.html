<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <link rel="icon" type="image/svg+xml" href="https://media.prts.wiki/e/e1/%E5%A4%B4%E5%83%8F_%E5%8F%B2%E5%B0%94%E7%89%B9%E5%B0%94.png" />
        <title>ArknightsLive2d-Web | 皮肤立绘</title>
        <script>
            (() => {
                const THEME_KEY = "arknights-live2d-theme";
                const prefersDark = window.matchMedia("(prefers-color-scheme: dark)");
                let theme = prefersDark.matches ? "dark" : "light";
                try {
                    const savedTheme = localStorage.getItem(THEME_KEY);
                    if (savedTheme === "dark" || savedTheme === "light") {
                        theme = savedTheme;
                    }
                } catch {
                    // Ignore storage access failures and fall back to system preference.
                }
                document.documentElement.setAttribute("data-theme", theme);
                window.__AK_INITIAL_THEME__ = theme;
            })();
        </script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="./assets/css/index.css" />
        <script src="./assets/js/spine-webgl.js"></script>
        <script src="./assets//js/MobileDrawer.js"></script>
        <script src="./assets/js/select.js"></script>
        <script src="./assets/js/SpinLoader.js"></script>
    </head>
    <body>
        <div id="spinWrapper">
            <spin-loader id="spin" size="100" color="#00aaff"></spin-loader>
        </div>
        <canvas id="canvas"></canvas>
        <header class="hud hud-top">
            <div class="brand">
                <span class="brand-tag">AK-L2D</span>
                <div class="brand-copy">
                    <p class="brand-subtitle">TACTICAL SKIN CONSOLE</p>
                    <h1>皮肤立绘展示</h1>
                </div>
            </div>
            <div class="operation">
                <search-select id="select" placeholder="搜索皮肤立绘"></search-select>
                <button type="button" onclick="drawer.open()">更多操作</button>
                <a href="/">
                    <button type="button">首页</button>
                </a>
                <button id="themeToggle" type="button">切换浅色</button>
            </div>
            <section class="stage-status" id="stageStatus" data-state="loading" aria-live="polite">
                <p class="stage-status-label">当前状态</p>
                <h2 id="stageStatusTitle">正在初始化展示台</h2>
                <p id="stageStatusText">首次加载会稍慢一些，请稍候。</p>
                <div class="stage-status-actions">
                    <button id="stageStatusRetry" type="button" hidden>重试</button>
                </div>
            </section>
        </header>
        <mobile-drawer id="drawer" side="left">
            <div style="padding: 16px">
                <div id="panel" onclick="drawer.close()"></div>
            </div>
        </mobile-drawer>
        <div class="footer hud">
            <a href="https://arknights.shuaxinjs.cn/" target="_blank" rel="noopener noreferrer">
                <button type="button">明日方舟生涯表</button>
            </a>
            <a href="https://www.xiaohongshu.com/user/profile/617ce3ac000000000201bc2c?xhsshare=CopyLink&appuid=617ce3ac000000000201bc2c&apptime=1652512227" target="_blank" rel="noopener noreferrer">
                <button type="button">作者 - 小红书</button>
            </a>
            <a href="https://home.shuaxinjs.cn/" target="_blank" rel="noopener noreferrer">
                <button type="button">作者 - 更多</button>
            </a>
            <a href="https://github.com/SHUAXINDIARY/ArknightsLive2d-Web" target="_blank" rel="noopener noreferrer">
                <button type="button">站点仓库</button>
            </a>
            <a href="https://github.com/isHarryh/Ark-Models" target="_blank" rel="noopener noreferrer">
                <button type="button">数据来源</button>
            </a>
        </div>
        <script type="module">
            import { init } from "./assets/js/index.js";
            import { renderMemberSelect, DATA_FILTER_TYPE } from "./assets/js/getData.js";

            const THEME_KEY = "arknights-live2d-theme";
            const STAGE_STATUS_EVENT = "ak:stage-status";
            const root = document.documentElement;
            const themeToggle = document.getElementById("themeToggle");
            const prefersDark = window.matchMedia("(prefers-color-scheme: dark)");
            const stageStatus = document.getElementById("stageStatus");
            const stageStatusTitle = document.getElementById("stageStatusTitle");
            const stageStatusText = document.getElementById("stageStatusText");
            const stageStatusRetry = document.getElementById("stageStatusRetry");
            let retryHandler = null;

            const setStageStatus = ({ state = "default", title = "展示台已就绪", message = "", retryLabel = "", retry = null }) => {
                stageStatus.dataset.state = state;
                stageStatusTitle.textContent = title;
                stageStatusText.textContent = message;
                retryHandler = typeof retry === "function" ? retry : null;
                const shouldHideStatus = state === "success" || state === "default";
                stageStatus.hidden = shouldHideStatus;

                if (!shouldHideStatus && retryHandler) {
                    stageStatusRetry.hidden = false;
                    stageStatusRetry.textContent = retryLabel || "重试";
                } else {
                    stageStatusRetry.hidden = true;
                }
            };

            stageStatusRetry.addEventListener("click", () => {
                if (!retryHandler) return;
                setStageStatus({
                    state: "loading",
                    title: "正在重新加载",
                    message: "请稍候，系统正在恢复展示。",
                });
                retryHandler();
            });

            window.addEventListener(STAGE_STATUS_EVENT, (event) => {
                const detail = event.detail || {};
                setStageStatus(detail);
            });

            const applyTheme = (theme) => {
                root.setAttribute("data-theme", theme);
                themeToggle.textContent = theme === "dark" ? "切换浅色" : "切换深色";
            };

            const initialTheme = window.__AK_INITIAL_THEME__ || root.getAttribute("data-theme") || (prefersDark.matches ? "dark" : "light");
            applyTheme(initialTheme);

            themeToggle.addEventListener("click", () => {
                const nextTheme = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
                applyTheme(nextTheme);
                localStorage.setItem(THEME_KEY, nextTheme);
            });

            if (prefersDark.addEventListener) {
                prefersDark.addEventListener("change", (event) => {
                    if (!localStorage.getItem(THEME_KEY)) {
                        applyTheme(event.matches ? "dark" : "light");
                    }
                });
            }

            init({
                dir: "Ark-Models/models_illust/dyn_illust_2025_shu_nian#11/",
                skelFile: "dyn_illust_char_2025_shu_nian#11.skel",
                atlasFile: "dyn_illust_char_2025_shu_nian#11.atlas",
                fitToCanvas: true,
            });
            renderMemberSelect([DATA_FILTER_TYPE.DynIllust]);
        </script>
    </body>
</html>
